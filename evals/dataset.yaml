# Evaluation dataset over Chinook (see evals/run.py and README).
#
# 55 items = 50 answerable questions (20 easy, 20 medium, 10 hard) + 5 out_of_scope
# questions that the agent must reject. Languages are mixed English / Spanish.
#
# Fields:
#   id            stable identifier (e = easy, m = medium, h = hard, o = out of scope)
#   level         easy (single table) | medium (joins + aggregations) |
#                 hard (subqueries, window functions, dates) | out_of_scope
#   language      en | es
#   question      what the user asks (column-shaped hints such as "show first name and
#                 last name" are given where the answer would otherwise be ambiguous)
#   sql           reference PostgreSQL query (null for out_of_scope); executed against the
#                 real database by tests/test_eval_dataset.py
#   tables        tables the reference SQL reads (CTEs excluded); derived with sqlglot
#                 (sql_guard.validate_sql) and checked by tests/test_eval_dataset.py
#   order_matters true when the question implies an order (top-N, cumulative...):
#                 row order is then part of the comparison
#
# Rankings (top-N) only appear where there is no tie at the cutoff or inside the top-N,
# so the expected answer is unambiguous.

- id: e01
  level: easy
  language: en
  question: "How many customers are there?"
  sql: |-
    SELECT count(*) AS customers FROM customer
  tables: [customer]

- id: e02
  level: easy
  language: es
  question: "¿Cuántos empleados hay?"
  sql: |-
    SELECT count(*) AS empleados FROM employee
  tables: [employee]

- id: e03
  level: easy
  language: en
  question: "List the names of all music genres, alphabetically."
  sql: |-
    SELECT name FROM genre ORDER BY name
  tables: [genre]
  order_matters: true

- id: e04
  level: easy
  language: es
  question: "¿Cuántas canciones hay en total?"
