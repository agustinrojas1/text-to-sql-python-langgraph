# Scope-classification dataset: 272 questions over the Chinook schema (see evals/scope_run.py).
#
# Question: should the SQL pipeline run at all? "scope: 1" = answerable with a read-only SELECT
# over the allowed tables; "scope: 0" = must be rejected (chit-chat, writes, attributes Chinook
# does not store such as ratings or salaries, prompt injection, ...).
#
# Composition: 136 items per split (dev / test), each with 65 in-scope and 71 out-of-scope.
#   - 110 come from the first round: 73 are the project's own questions (the 55 of
#     evals/dataset.yaml, 5 of them out of scope, and the 18 of evals/holdout.yaml; category "in"
#     or "orig_oos") plus 37 out-of-scope questions written for the first scope benchmark
#     (categories "unanswerable", "write", "trivia", "other_biz", "injection", "chitchat",
#     "coding", "opinion"). Split 55 / 55.
#   - 162 are adversarial items written for this project to stress a scope classifier.
#     Out of scope (scope 0): "unanswerable" (sounds in-domain but the data is not there),
#     "write", "write_polite", "forecast", "opinion", "opinion_reco", "trivia", "trivia_music",
#     "other_biz", "other_company", "meta" (questions about the system), "injection",
#     "injection_embedded" (an instruction hidden inside a legitimate question), "multi_intent"
#     (one answerable part, one not), "code_request", "coding", "chitchat", "chitchat2",
#     "gibberish".
#     In scope (scope 1), hard negatives that look odd or dangerous but are plain reads:
#     "write_word_read" (SQL verbs used as data words), "employee_hr", "best_selling",
#     "price_duration", "playlist_media", "terse", "typos", "mixed_lang", "long",
#     "numbers_dates", "rioplatense_in".
#     Items whose label was ambiguous were left out rather than guessed.
#
# Fields: id, q (question), lang (en | es | mixed), scope (1 in / 0 out), cat (category above),
#         split (dev | test).
#
# Languages: English and Spanish on purpose (133 en, 135 es, 4 mixed), including rioplatense
# phrasing ("mostrame", "tenés", "decime"), because the agent answers in the user's language.
#
# Provenance and honesty: written and labelled by hand for this project (with LLM assistance
# for drafting); nothing was scraped. The original items keep the split of their source file;
# the new ones were split at random, alternating within each (scope, language, category) group.
# Cascade thresholds were tuned on dev only and reported on test, but both come from the same
# small pool and the author saw both sets while writing them, so treat the numbers as
# indicative, not as a population estimate.

